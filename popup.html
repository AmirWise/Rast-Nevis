<!doctype html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      max-height: 560px;
      overflow-y: auto;
      background: #0b0e14;
      color: #e7e9ea;
      font-family: Vazirmatn, IRANSans, "Segoe UI", Tahoma, sans-serif;
      padding: 14px;
    }
    body::-webkit-scrollbar { width: 5px; }
    body::-webkit-scrollbar-thumb { background: #2f3336; border-radius: 4px; }

    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .head img { width: 36px; height: 36px; border-radius: 9px; }
    .head h1 { font-size: 15px; font-weight: 800; }
    .head p { font-size: 11px; color: #71767b; margin-top: 1px; }

    .section-title {
      font-size: 11.5px;
      font-weight: 700;
      color: #71767b;
      margin: 12px 0 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .section-title svg { width: 13px; height: 13px; color: #1d9bf0; }

    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 11px; background: #16181d; border: 1px solid #2f3336;
      border-radius: 11px; margin-bottom: 6px; cursor: pointer;
    }
    .row span { font-size: 12.5px; font-weight: 600; }
    .toggle { position: relative; width: 36px; height: 20px; border-radius: 99px; background: #2f3336; transition: .2s; flex-shrink: 0; }
    .toggle::after {
      content: ""; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px;
      border-radius: 50%; background: #71767b; transition: .2s;
    }
    input[type="checkbox"] { display: none; }
    input[type="checkbox"]:checked + .toggle { background: linear-gradient(90deg, #1d9bf0, #8b5cf6); }
    input[type="checkbox"]:checked + .toggle::after { transform: translateX(-16px); background: #fff; }

    /* باکس آزمون متن */
    .test-box {
      background: #16181d;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 10px;
      margin-top: 4px;
    }
    .test-textarea {
      width: 100%;
      height: 72px;
      background: #0b0e14;
      border: 1px solid #2f3336;
      border-radius: 8px;
      color: #e7e9ea;
      font-family: inherit;
      font-size: 12.5px;
      line-height: 1.6;
      padding: 8px 10px;
      resize: vertical;
      outline: none;
      transition: border-color .15s ease;
      direction: rtl;
    }
    .test-textarea:focus { border-color: #1d9bf0; }
    .test-textarea::placeholder { color: #536471; font-size: 11.5px; }

    .test-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .btn {
      flex: 1;
      padding: 6px 8px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: filter .15s, background .15s;
    }
    .btn:hover { filter: brightness(1.15); }
    .btn-primary { background: #1d9bf0; color: #fff; }
    .btn-secondary { background: #2f3336; color: #e7e9ea; }
    .btn-accent { background: linear-gradient(90deg, #1d9bf0, #8b5cf6); color: #fff; }
    .btn-sm { flex: 0 0 auto; padding: 6px 10px; }

    .test-result {
      margin-top: 8px;
      display: none;
    }
    .test-status {
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-clean { background: rgba(0, 186, 124, .12); color: #00ba7c; border: 1px solid rgba(0, 186, 124, .25); }
    .status-dirty { background: rgba(244, 33, 46, .12); color: #f4212e; border: 1px solid rgba(244, 33, 46, .25); }

    .test-issues {
      max-height: 140px;
      overflow-y: auto;
      border-radius: 8px;
      background: #0b0e14;
      border: 1px solid #2f3336;
      padding: 4px 8px;
    }
    .test-issues::-webkit-scrollbar { width: 4px; }
    .test-issues::-webkit-scrollbar-thumb { background: #2f3336; }
    .issue-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(47, 51, 54, .5);
      font-size: 12px;
    }
    .issue-row:last-child { border-bottom: none; }
    .issue-w { color: #f4212e; text-decoration: line-through; }
    .issue-c { color: #00ba7c; font-weight: 700; }
    .issue-r { color: #71767b; font-size: 10.5px; margin-inline-start: auto; }

    /* واژه‌نامه شخصی */
    .dict-box {
      background: #16181d;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 8px 10px;
      margin-top: 4px;
    }
    .dict-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 85px;
      overflow-y: auto;
    }
    .dict-list::-webkit-scrollbar { width: 3px; }
    .dict-list::-webkit-scrollbar-thumb { background: #2f3336; }
    .dict-empty {
      font-size: 11px;
      color: #71767b;
      padding: 4px 0;
    }
    .dict-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(29, 155, 240, 0.12);
      border: 1px solid rgba(29, 155, 240, 0.3);
      color: #1d9bf0;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .dict-tag-del {
      background: none;
      border: none;
      color: #71767b;
      font-size: 11px;
      cursor: pointer;
      line-height: 1;
      padding: 0 1px;
      display: inline-flex;
      align-items: center;
      transition: color .15s;
    }
    .dict-tag-del:hover {
      color: #f4212e;
    }

    /* آمار و فوتر */
    .stat {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 11px; margin-top: 8px;
      background: linear-gradient(135deg, rgba(29,155,240,.12), rgba(139,92,246,.12));
      border: 1px solid rgba(29,155,240,.25);
    }
    .stat b { font-size: 18px; font-weight: 900; background: linear-gradient(90deg,#61b6f7,#b49bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .stat span { font-size: 11px; color: #a9b0b7; max-width: 180px; line-height: 1.4; }

    .foot { margin-top: 10px; text-align: center; font-size: 10.5px; color: #536366; }
    .reset { background: none; border: none; color: #1d9bf0; font: inherit; font-size: 10.5px; cursor: pointer; }
    .reset:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="head">
    <img src="icons/icon.png" alt="راست‌نویس" />
    <div>
      <h1>راست‌نویس</h1>
      <p>ویراستار هوشمند فارسی در توییتر/X</p>
    </div>
  </div>

  <label class="row">
    <span>فعال بودن افزونه</span>
    <input type="checkbox" id="enabled" />
    <i class="toggle"></i>
  </label>
  <label class="row">
    <span>نمایش پیشنهادهای ظریف (تنوین و تکرار)</span>
    <input type="checkbox" id="hints" />
    <i class="toggle"></i>
  </label>

  <div class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    <span>تست و بررسی درست‌نویسی جمله</span>
  </div>

  <div class="test-box">
    <textarea id="testInput" class="test-textarea" placeholder="جمله یا متن خود را برای بررسی بنویسید (مثال: توییته تستی با كمی مشگل)..."></textarea>
    <div class="test-actions">
      <button id="btnCheck" class="btn btn-primary">بررسی متن</button>
      <button id="btnAutoFix" class="btn btn-accent" style="display: none;">اصلاح خودکار</button>
      <button id="btnCopyFixed" class="btn btn-secondary" style="display: none;">کپی اصلاح‌شده</button>
      <button id="btnClear" class="btn btn-secondary btn-sm" title="پاک کردن">✕</button>
    </div>

    <div id="testResult" class="test-result">
      <div id="testStatus" class="test-status"></div>
      <div id="testIssues" class="test-issues"></div>
    </div>
  </div>

  <div class="section-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>واژه‌نامه شخصی (کلمات نادیده‌گرفته‌شده)</span>
  </div>

  <div class="dict-box">
    <div id="dictList" class="dict-list">
      <span class="dict-empty">هنوز کلمه‌ای نادیده گرفته نشده است.</span>
    </div>
  </div>

  <div class="stat">
    <b id="count">۰</b>
    <span>توییت دارای خطا که در تایم‌لاین نشانه‌گذاری شده</span>
  </div>

  <div class="foot">
    پردازش ۱۰۰٪ محلی و امن ·
    <button class="reset" id="resetDict" title="پاکسازی لغت‌نامه شخصی">پاک‌کردن لغات شخصی</button> ·
    <button class="reset" id="reset">صفر کردن آمار</button>
  </div>

  <script src="engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
